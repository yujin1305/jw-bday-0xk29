<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>진웅의 생일 대작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
/* Layout concept: one pixel-art screen (15x11 tiles, RPG Maker proportions) on top, thumb controls below. Single committed night-violet look, so no light theme. */
:root {
  --heart: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'><path d='M12 21C4 14 1 10.5 1 6.5 1 3.2 3.6 1 6.6 1c2.3 0 4.2 1.2 5.4 3.2C13.200 2.200 15.100 1 17.400 1 20.400 1 23 3.200 23 6.500 23 10.500 20 14 12 21z'/></svg>");
  --night: #241d3d;
  --ink: #3a2f4a;
  --paper: #fff8ec;
  --rose: #ff6f9b;
  --mint: #3fae8a;
  --gold: #ffd166;
  --font-ui: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-note: 'Gamja Flower', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: linear-gradient(#3a2a63, #5a3d7a 60%, #7a4a86); background-attachment: fixed; }
body {
  min-height: 100%;
  color: var(--paper);
  font-family: var(--font-ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
.stage { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.screen {
  position: relative; width: 100%; aspect-ratio: 15 / 11; container-type: inline-size;
  background: #000; border: 11px solid #fff; border-radius: 26px; overflow: hidden;
  box-shadow: 0 0 0 3px #ffc4d8, 0 9px 0 3px #f2a9c4, 0 18px 28px rgba(255,150,190,.35), inset 0 0 0 3px #ffe3ee;
  touch-action: manipulation;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }

.hud { position: absolute; top: 2cqw; left: 2cqw; right: 2cqw; display: flex; gap: 1.6cqw; align-items: center; pointer-events: none; }
.hud .count {
  background: rgba(29,24,48,.78); border: 2px solid var(--paper); border-radius: 99px; padding: .15em .8em;
  font-size: clamp(11px, 3.4cqw, 17px); letter-spacing: .04em; color: var(--paper); margin-right: auto;
}
.aff { position: absolute; top: 12.5cqw; left: 2cqw; z-index: 2; pointer-events: none; font-size: clamp(11px, 3.3cqw, 17px); color: var(--paper); background: rgba(26,21,54,.82); border: 2px solid var(--paper); border-radius: 99px; padding: .15em .8em; white-space: nowrap; }
.aff b { color: #ff7aa8; font-weight: 400; letter-spacing: .02em; }
.aff.up { animation: affup .7s; } .aff.down { animation: affdown .5s; }
@keyframes affup { 30% { transform: scale(1.18); background: rgba(160,40,90,.9); } }
@keyframes affdown { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
.hud .count b { color: var(--rose); font-weight: 400; letter-spacing: .12em; }
.pill {
  pointer-events: auto; font: inherit; font-size: clamp(11px, 3.3cqw, 16px); color: var(--paper);
  background: rgba(29,24,48,.78); border: 2px solid var(--paper); border-radius: 99px; padding: .15em .9em; min-height: 28px; cursor: pointer;
}
.pill:focus-visible, .abtn:focus-visible, #again:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.dlg {
  position: absolute; left: 2cqw; right: 2cqw; bottom: 2cqw; display: flex; gap: 2.4cqw; align-items: flex-start;
  background: rgba(255,248,236,.97); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px;
  padding: 2.2cqw 3cqw 2.6cqw 2.6cqw; min-height: 19cqw; font-size: clamp(13px, 4.1cqw, 22px); line-height: 1.5;
  box-shadow: 0 .3em 0 rgba(0,0,0,.35); cursor: pointer;
}
.dlg .face { flex: 0 0 13cqw; width: 13cqw; height: 13cqw; border: 2px solid var(--ink); border-radius: 6px; image-rendering: pixelated; background: #fff; }
.dlg .body { min-width: 0; flex: 1; overflow-wrap: anywhere; word-break: keep-all; }
.dlg .who { display: inline-block; font-size: .78em; color: #fff; padding: 0 .7em; border-radius: 99px; margin-bottom: .15em; }
.dlg.jin .who { background: var(--mint); }
.dlg.girl .who { background: var(--rose); }
.dlg.note .who { background: #d9962b; }
.dlg.narr .who { display: none; }
.dlg.narr .txt { color: #5b4a73; }
.dlg.note { background: #fff4c9; font-family: var(--font-note); font-size: clamp(15px, 4.9cqw, 26px); border-style: dashed; }
.dlg.note .txt { color: #5b3d2a; }
.dlg .next { position: absolute; right: 2.2cqw; bottom: .8cqw; font-size: .75em; color: var(--rose); animation: blink 1s steps(2) infinite; }
.toast {
  position: absolute; top: 11cqw; left: 50%; transform: translateX(-50%); max-width: 92%; text-align: center;
  background: var(--gold); color: var(--ink); border: 2px solid var(--ink); border-radius: 99px; padding: .25em 1em;
  font-size: clamp(12px, 3.8cqw, 20px); opacity: 0; transition: opacity .25s; pointer-events: none;
}
.toast.on { opacity: 1; }
.toast { z-index: 6; }
.fade { position: absolute; inset: 0; background: #000; z-index: 7; pointer-events: none; opacity: 0; }
.fade.go { animation: fadeout .7s ease-out; }
@keyframes fadeout { 0% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fade.go { animation: none; } }
.pad { position: relative; border-radius: 20px; transition: background .4s; }
.pad.fx { background: linear-gradient(#150f33, #2a1a52); }
.padfx { position: absolute; left: -16px; top: -8px; width: calc(100% + 32px); height: calc(100% + 16px); pointer-events: none; z-index: 2; }
.cg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.choices { position: absolute; left: 6cqw; right: 6cqw; bottom: 25cqw; top: 12cqw; display: flex; flex-direction: column; gap: 2cqw; z-index: 4; overflow-y: auto; }
.choices button:first-child { margin-top: auto; }
.choices.many { gap: 1.2cqw; }
.choices.many button { font-size: clamp(11px, 3.4cqw, 18px); padding: .32em .75em; border-width: 2px; }
.choices button { font: inherit; font-size: clamp(13px, 4.2cqw, 22px); color: var(--ink); background: rgba(255,248,236,.97); border: 3px solid var(--ink); border-radius: 12px; padding: .5em .9em; cursor: pointer; text-align: left; box-shadow: 0 .25em 0 rgba(0,0,0,.35); }
.choices button:hover, .choices button:focus-visible { background: #ffe9a8; outline: none; }
.blow { position: absolute; inset: 0; z-index: 3; background: #1a1536; }
.resume { font: inherit; font-size: clamp(14px, 4.6cqw, 24px); color: #fff; background: #ff6f9b; border: 3px solid #fff; border-radius: 99px; padding: .35em 1.4em; cursor: pointer; box-shadow: 0 .3em 0 #c4488a; }
.skipbtn { position: absolute; right: 3cqw; bottom: 3cqw; z-index: 8; font: inherit; font-size: clamp(12px, 3.8cqw, 20px); color: var(--ink); background: rgba(255,255,255,.95); border: 2px solid #ff8fb1; border-radius: 99px; padding: .3em 1em; cursor: pointer; box-shadow: 0 .2em 0 #f2a9c4; }
.screen.prolog .hud, .screen.prolog .aff { display: none; }
.pol { position: absolute; z-index: 2; top: 4cqw; left: 50%; width: 46cqw; padding: 2cqw 2cqw 0; background: #fff; border-radius: 3px; box-shadow: 0 .8cqw 0 rgba(0,0,0,.25); transform: translateX(-50%) rotate(-3deg); animation: polin .45s ease-out; pointer-events: none; text-align: center; }
.pol img { width: 100%; display: block; image-rendering: pixelated; aspect-ratio: 4/3; }
.pol span { display: block; font-family: var(--font-note); color: #3a2f4a; font-size: clamp(11px, 3.6cqw, 18px); padding: .5em 0 .6em; }
@keyframes polin { from { transform: translateX(-50%) translateY(-30%) rotate(8deg) scale(.6); opacity: 0; } }
.dpanel { position: absolute; right: 0; top: 0; bottom: 0; width: 54%; display: flex; flex-direction: column; gap: 2.2cqw; padding: 2.5cqw; background: rgba(255,248,236,.94); border-left: 3px solid var(--ink); box-sizing: border-box; overflow-y: auto; }
.dtabs { display: flex; gap: 1cqw; } .dtabs button, .dopts button, .ddone { font: inherit; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 8px; cursor: pointer; font-size: clamp(11px, 3.4cqw, 18px); padding: .3em .4em; }
.dtabs button { flex: 1; padding: .3em 0; white-space: nowrap; font-size: clamp(10px, 3cqw, 16px); } .dtabs button.on, .dopts button.on { background: #ffd166; box-shadow: 0 0 0 2px #ff6f9b; }
.dopts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5cqw; } .dopts button { display: flex; align-items: center; gap: .4em; text-align: left; } .dopts i { width: 1.1em; height: 1.1em; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.ddone { margin-top: auto; background: #ff8fb1; font-size: clamp(13px, 4.2cqw, 22px); box-shadow: 0 .25em 0 rgba(0,0,0,.35); }
.blow canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.bhud { position: absolute; left: 4cqw; right: 4cqw; bottom: 3cqw; display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; }
.bhud p { margin: 0; font-size: clamp(12px, 4cqw, 20px); color: var(--paper); text-shadow: 0 2px 0 #000; text-align: center; }
.meter { width: 70%; height: 3cqw; min-height: 10px; border: 2px solid var(--paper); border-radius: 99px; overflow: hidden; background: rgba(0,0,0,.4); }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8fd3ff, #fff); }
.bbtn { font: inherit; font-size: clamp(14px, 4.6cqw, 24px); color: #fff; background: var(--rose); border: 3px solid var(--paper); border-radius: 99px; padding: .25em 1.6em; min-height: 40px; cursor: pointer; box-shadow: 0 .2em 0 #a63b66; touch-action: manipulation; }
.bbtn:active { transform: translateY(3px); box-shadow: 0 .05em 0 #a63b66; }
.ending .msg { margin: 0; font-family: var(--font-note); font-size: clamp(14px, 4.8cqw, 25px); line-height: 1.35; color: #ffe9a8; }
.gifts small { display: block; font-size: .8em; color: #ffd1e3; }
.gifts li { text-align: center; max-width: 24cqw; }
.ending .kicker { display: none; }

.title {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; text-align: center; padding: 3cqw;
  background:
    radial-gradient(circle at 12% 18%, #fff 0 .35%, transparent .6%), radial-gradient(circle at 80% 12%, #fff 0 .4%, transparent .7%),
    radial-gradient(circle at 30% 70%, #ffe9a0 0 .35%, transparent .6%), radial-gradient(circle at 90% 62%, #fff 0 .3%, transparent .6%),
    radial-gradient(circle at 60% 30%, #ffd1e3 0 .3%, transparent .6%), radial-gradient(circle at 6% 80%, #fff 0 .3%, transparent .6%),
    linear-gradient(#1c1640, #3b2a63 70%, #5b3a78);
  cursor: pointer;
}
.title .date { font-size: clamp(11px, 3.6cqw, 18px); letter-spacing: .3em; color: #ffd1e3; }
.title h1 { margin: 0; font-weight: 400; font-size: clamp(26px, 10cqw, 56px); line-height: 1.05; color: var(--gold); text-shadow: 0 .06em 0 #c4488a, 0 .12em 0 #1d1830; text-wrap: balance; }
.title .sub { font-size: clamp(11px, 3.6cqw, 18px); color: #cfc7ff; }
.title canvas { display: none; }
.title .tbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; z-index: 0; }
.title::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(rgba(30,16,60,.72), rgba(30,16,60,0) 38%, rgba(30,16,60,0) 55%, rgba(30,16,60,.82)); }
.title > *:not(.tbg) { position: relative; z-index: 2; }
.title { justify-content: flex-start; z-index: 6; }
.title .sub { margin-top: auto; text-shadow: 0 2px 0 #1d1830; color: #fff; }
.title .start { text-shadow: 0 2px 0 #1d1830; }
.title .start { margin-top: 1cqw; font-size: clamp(13px, 4.4cqw, 22px); color: var(--paper); animation: blink 1.1s steps(2) infinite; }

.ending {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 1.2cqw;
  background: rgba(24,18,48,.94); padding: 2.5cqw; text-align: center; overflow-y: auto;
}
.ending .kicker { margin: 0; letter-spacing: .35em; font-size: clamp(9px, 2.6cqw, 14px); color: var(--rose); }
.ending h2 { margin: 0; font-weight: 400; font-size: clamp(18px, 6.4cqw, 36px); color: var(--gold); text-shadow: 0 .07em 0 #c4488a; text-wrap: balance; }
.gifts { list-style: none; margin: 1cqw 0; padding: 0; display: flex; gap: 2.4cqw; justify-content: center; }
.gifts li { display: flex; flex-direction: column; align-items: center; gap: .4em; font-size: clamp(11px, 3.6cqw, 18px); }
.gifts .veil { width: 12cqw; height: 12cqw; display: grid; place-items: center; font-size: 6cqw; background: repeating-linear-gradient(45deg,#ffe3ee 0 6px,#fff 6px 12px); border: 2px dashed #ff8fb1; border-radius: 8px; }
.gifts canvas { width: 12cqw; height: 12cqw; image-rendering: pixelated; background: #3a2f5e; border: 2px solid var(--paper); border-radius: 8px; padding: .8cqw; }
.ending .fin { margin: 0; font-size: clamp(12px, 3.8cqw, 19px); line-height: 1.5; color: #e8e0ff; }
#albumBtn { font: inherit; font-size: clamp(12px, 3.8cqw, 19px); color: #fff; background: #ff6f9b; border: 2px solid var(--ink); border-radius: 99px; padding: .3em 1.2em; min-height: 32px; cursor: pointer; }
.btns { display: flex; gap: 2cqw; justify-content: center; }
.album { position: absolute; inset: 0; z-index: 9; background: #fff8ec; color: var(--ink); overflow-y: auto; padding: 3cqw 4cqw; font-size: clamp(11px, 3.5cqw, 18px); display: flex; flex-direction: column; gap: 1.4cqw; }
.album h3 { margin: 0; text-align: center; font-weight: 400; font-size: 1.5em; color: #d6457a; }
.album .row { display: flex; justify-content: space-between; background: #fff; border: 2px solid #ffc4d8; border-radius: 10px; padding: .25em .8em; }
.album .row b { color: #d6457a; font-weight: 400; }
.album .ph { display: flex; gap: 1.5cqw; justify-content: center; }
.album .ph img, .album .ph i { width: 15cqw; aspect-ratio: 4/3; image-rendering: pixelated; border: 2px solid #fff; box-shadow: 0 0 0 2px #ffc4d8; background: #eee; display: grid; place-items: center; font-style: normal; color: #bbb; }
.album .pct { text-align: center; font-size: 1.3em; color: #3a2f4a; }
.album button { align-self: center; font: inherit; color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 99px; padding: .3em 1.4em; cursor: pointer; }
#again { font: inherit; font-size: clamp(12px, 3.8cqw, 19px); color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 99px; padding: .3em 1.2em; min-height: 32px; cursor: pointer; box-shadow: 0 .2em 0 #a8802c; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -6%; width: 1.6cqw; height: 2.4cqw; opacity: .9; animation: fall linear infinite; }

.pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 6px 0; }
.dpad {
  position: relative; width: min(46vw, 176px); aspect-ratio: 1; border-radius: 50%; touch-action: none; flex: none;
  background: radial-gradient(circle, #fff 0 20%, #ffe3ee 21% 100%); border: 5px solid #fff; box-shadow: 0 0 0 3px #ffc4d8, 0 6px 0 3px #f2a9c4;
}
.dpad::after { content: ''; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%,-50%); background: #ff8fb1; -webkit-mask: var(--heart) center/contain no-repeat; mask: var(--heart) center/contain no-repeat; }
.dpad i { position: absolute; font-style: normal; color: #ffa7c4; font-size: 26px; line-height: 1; transform: translate(-50%, -50%); text-shadow: 0 2px 0 #fff; }
.dpad i.up { left: 50%; top: 16%; } .dpad i.down { left: 50%; top: 84%; }
.dpad i.left { left: 16%; top: 50%; } .dpad i.right { left: 84%; top: 50%; }
.dpad[data-dir="up"] i.up, .dpad[data-dir="down"] i.down, .dpad[data-dir="left"] i.left, .dpad[data-dir="right"] i.right { color: #e8325f; transform: translate(-50%, -50%) scale(1.3); }
.mid { flex: 1; text-align: center; font-size: 12px; color: #ffd6e6; line-height: 1.5; min-width: 0; }
.abtn {
  width: min(32vw, 116px); aspect-ratio: 1; border: 0; flex: none; color: #fff; font: inherit; font-size: 30px; touch-action: manipulation; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #ffb3cc, #ff5c8d 70%); -webkit-mask: var(--heart) center/contain no-repeat; mask: var(--heart) center/contain no-repeat;
  filter: drop-shadow(0 5px 0 #fff) drop-shadow(0 8px 0 #f2a9c4); padding-bottom: 8%; text-shadow: 0 2px 0 #c43c6c;
}
.abtn:active { transform: translateY(5px) scale(.96); filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 0 #f2a9c4); }
@media (hover: none), (max-width: 520px) { .mid .kb { display: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fall { to { transform: translateY(120cqh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  .title .start, .dlg .next { animation: none; }
  .confetti { display: none; }
}
</style>

<main class="stage">
  <div class="screen" id="screen">
    <canvas id="cv" width="240" height="176" aria-label="게임 화면"></canvas>
    <canvas class="cg" id="cg" width="120" height="88" hidden></canvas>
    <div class="hud">
      <span class="count" id="count">흔적 <b>♡♡♡</b></span>
      <button class="pill" id="hint" type="button">힌트</button>
      <button class="pill" id="snd" type="button" aria-pressed="true">소리 ON</button>
    </div>
    <div class="aff" id="aff"></div>
    <div class="pol" id="pol" hidden><img id="polimg" alt=""><span id="polcap"></span></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="dlg" id="dlg" hidden>
      <canvas class="face" id="face" width="24" height="24" hidden></canvas>
      <div class="body"><span class="who" id="who"></span><div class="txt" id="txt"></div></div>
      <span class="next" id="next">▼</span>
    </div>
    <div class="choices" id="choices" hidden></div>
    <button class="skipbtn" id="skipbtn" type="button" hidden>건너뛰기 ⏭</button>
    <div class="album" id="album" hidden></div>
    <div class="fade" id="fade"></div>
    <div class="blow" id="blow" hidden>
      <canvas id="bcv" width="120" height="88"></canvas>
      <div class="bhud">
        <p id="bmsg">촛불을 꺼 보자! 버튼을 연타해!</p>
        <div class="meter"><i id="bmeter"></i></div>
        <button class="bbtn" id="bbtn" type="button">후~ 불기!</button>
      </div>
    </div>
    <div class="blow" id="brk" hidden>
      <canvas id="kcv" width="120" height="88" style="touch-action:none"></canvas>
    </div>
    <div class="blow" id="run" hidden>
      <canvas id="rcv" width="120" height="88" style="touch-action:none"></canvas>
    </div>
    <div class="blow" id="wheel" hidden>
      <canvas id="wcv" width="120" height="88" style="touch-action:none"></canvas>
    </div>
    <div class="blow" id="dress" hidden>
      <canvas id="dcv" width="120" height="88"></canvas>
      <div class="dpanel"><div class="dtabs" id="dtabs"></div><div class="dopts" id="dopts"></div><button class="ddone" id="ddone">완성! ✿</button></div>

/* ---------- cute rain (lotus pond) ---------- */

/* ---------- potter's wheel timing game ---------- */

function startWheel(cb) { doorFade(); held.length = 0; $('dpad').dataset.dir = ''; Object.assign(wheel, { amp: 7, hits: 0, miss: 0, pos: 0, dir: 1, t: 0, cb, done: 0, flash: 0, msg: '', msgT: 0, hand: 0 }); mode = 'wheel'; wEl.hidden = false; sfx.open(); }

function drawWheel(now) {

(() => {

/* ---------- input ---------- */
